name: Azure Login Test

on:
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Show Current Subscription
        run: |
          echo "=============================="
          echo "CURRENT SUBSCRIPTION"
          echo "=============================="
          az account show --output table

      - name: List All Resource Groups
        run: |
          echo "=============================="
          echo "RESOURCE GROUPS"
          echo "=============================="
          az group list --output table

      - name: List All Azure Container Registries
        run: |
          echo "=============================="
          echo "AZURE CONTAINER REGISTRIES"
          echo "=============================="
          az acr list --output table

      - name: Show Registry Names Only
        run: |
          echo "=============================="
          echo "REGISTRY NAMES"
          echo "=============================="
          az acr list --query "[].name" --output table

      - name: Registry Count
        run: |
          echo "=============================="
          echo "REGISTRY COUNT"
          echo "=============================="
          az acr list --query "length(@)"

      - name: List Registry Resources
        run: |
          echo "=============================="
          echo "ACR RESOURCE TYPE"
          echo "=============================="
          az resource list \
            --resource-type Microsoft.ContainerRegistry/registries \
            --output table

      - name: List All Resources
        run: |
          echo "=============================="
          echo "ALL AZURE RESOURCES"
          echo "=============================="
          az resource list --output table
